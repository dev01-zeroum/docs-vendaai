# Deploy automático para o GitHub Pages a cada merge na main.
#
# Faz exatamente o que era feito na mão (`npm run deploy` = docusaurus
# deploy → build + push na branch gh-pages), então nada muda nas
# configurações do Pages do repositório: a fonte continua sendo a branch
# gh-pages e o static/CNAME continua preservando o domínio customizado.
#
# Nenhum secret precisa ser criado: o GITHUB_TOKEN é gerado pelo próprio
# Actions a cada execução.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Necessário para o push na branch gh-pages.
permissions:
  contents: write

# Dois merges seguidos não podem publicar ao mesmo tempo. Sem
# cancel-in-progress: um deploy interrompido no meio deixaria o site
# publicado pela metade.
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publica em docs.vendaai.com.br
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # O docusaurus deploy precisa do histórico para escrever na gh-pages.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instala as dependências
        run: npm ci

      - name: Identidade do commit de publicação
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build e publicação
        env:
          USE_SSH: false
          GIT_USER: ${{ github.actor }}
          GIT_PASS: ${{ secrets.GITHUB_TOKEN }}
        run: npx docusaurus deploy
